<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="description" content="BETTER Interval Coach"><link rel="stylesheet" href="css/styles.css"><title>BETTER Interval Coach</title></head><body><div class="app-shell"><header class="topbar"><div><span class="eyebrow">BETTER</span><h1>Interval Coach</h1></div><a class="text-button" href="./">Training planner →</a><button id="soundToggle" class="icon-button" aria-label="Toggle sound">Sound</button></header><main><section id="setupView" class="view"><div class="hero-copy"><p class="eyebrow">TRAIN HARD. STAY ON TIME.</p><h2>Set your workout.</h2><p class="muted">Large cues and simple controls for riding.</p></div><div class="presets"><button class="preset" data-preset="quick">4 × 4 min</button><button class="preset" data-preset="power">6 × 3 min</button><button class="preset" data-preset="custom">Custom</button></div><div class="settings-card"><div class="setting-row"><div class="setting-copy"><span class="setting-label">Interval</span><strong id="workValue">04:00</strong></div><input id="workSlider" type="range" min="15" max="2700" step="15" value="240"></div><div class="setting-row"><div class="setting-copy"><span class="setting-label">Intervals</span><strong id="countValue">4</strong></div><input id="countSlider" type="range" min="1" max="20" value="4"></div><div class="setting-row"><div class="setting-copy"><span class="setting-label">Rest</span><strong id="restValue">03:00</strong></div><input id="restSlider" type="range" min="0" max="600" step="15" value="180"></div></div><div class="options-card"><label class="switch-row"><span><strong>Countdown</strong></span><input id="countdownToggle" type="checkbox" checked></label><label class="switch-row"><span><strong>Vibration</strong></span><input id="vibrationToggle" type="checkbox" checked></label><label class="switch-row"><span><strong>Voice cues</strong></span><input id="voiceToggle" type="checkbox" checked></label></div><div class="voice-card"><strong>Your voice</strong><button id="recordVoiceButton" class="secondary-button">Record</button><div id="voiceStatus">No recording yet</div><button id="clearVoiceButton" class="text-button">Clear recording</button></div><button id="startButton" class="primary-button">Start workout →</button></section><section id="timerView" class="view hidden"><div class="timer-top"><button id="backButton" class="text-button">← Setup</button><span id="phaseCount" class="pill">Interval 1 / 4</span></div><div id="timerCard" class="timer-card work-phase"><span id="phaseLabel" class="phase-label">INTERVAL</span><div id="timerDisplay" class="timer-display">04:00</div><div id="nextLabel" class="next-label">Next: Rest</div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div></div><div class="timer-actions"><button id="pauseButton" class="secondary-button">Pause</button><button id="skipButton" class="secondary-button">Skip</button></div><button id="stopButton" class="danger-button">End workout</button></section><section id="completeView" class="view hidden complete-view"><div class="complete-icon">✓</div><p class="eyebrow">WORKOUT COMPLETE</p><h2>Session done.</h2><p id="summaryText" class="muted"></p><button id="againButton" class="primary-button">Set up another workout</button></section></main></div><script src="js/app.js"></script></body></html>
